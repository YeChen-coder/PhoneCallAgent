[project]
name = "clinic-phone-agent"
version = "0.1.0"
description = "AI phone receptionist for a small clinic: Twilio + OpenAI Realtime + tool-calling scheduler"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "twilio>=9.0",
    "openai>=1.60",
    "httpx>=0.27",
    "tzdata",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
